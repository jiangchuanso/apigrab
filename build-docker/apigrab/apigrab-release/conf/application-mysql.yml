spring:
  datasource:
    url: jdbc:mysql://${MYSQLDB_HOST:localhost}:${MYSQLDB_PORT:3306}/${MYSQLDB_NAME:apigrab}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF8&autoReconnect=true&useSSL=false&allowMultiQueries=true&failOverReadOnly=false&connectTimeout=30000&serverTimezone=Asia/Shanghai
    username: ${MYSQLDB_USERNAME:root}
    password: ${MYSQLDB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    validation-query: SELECT 1
    test-on-borrow: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/mysql
    table: FLYWAY_SCHEMA_HISTORY
